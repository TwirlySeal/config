[Legendary]
; Disables the automatic update check
disable_update_check = false
; Disables the notice about an available update on exit
disable_update_notice = true

[Sugar]
# Found with `paru -Ql proton-ge-custom-bin | rg proton`
wine_executable = /usr/share/steam/compatibilitytools.d/proton-ge-custom/proton

# Dedicated folder to store Windows save files and registry
wine_prefix = /home/ethan/.rocket_league_prefix

start_with_wine = True

wrapper = env PROTON_VERSION="GE-Proton" PROTON_USE_SDL=1 /usr/share/steam/compatibilitytools.d/proton-ge-custom/proton run

# Tell legendary not to call native system wine since the wrapper handles it
no_wine = true

# Environment variables for Proton
[Sugar.env]
STEAM_COMPAT_CLIENT_INSTALL_PATH=/usr/share/steam
STEAM_COMPAT_DATA_PATH=/home/ethan/.rocket_league_prefix
